name: Release

on:
  push:
    tags: ['v*.*.*']
  # Lets an existing tag be (re)published, e.g. if a push to Docker Hub failed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.5.0)'
        required: true

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Catches a tag pushed before the version bump was merged.
      - name: Check tag matches package versions
        run: |
          VERSION="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi
          node scripts/check-version.mjs
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section for $VERSION"
            exit 1
          fi

      # QEMU lets the amd64 runner also build arm64 images (Raspberry Pi, Graviton).
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Root context because the backend image imports ../shared.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/habit-tracker-backend:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/habit-tracker-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/habit-tracker-frontend:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/habit-tracker-frontend:latest

      # Skipped when the release already exists, so re-running for a
      # hand-made release only republishes the images.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
